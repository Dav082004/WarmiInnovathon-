name: 🐞 Bug
description: Algo que no funciona como debería
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      placeholder: Al hacer clic en "Enviar" no pasa nada.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería pasar?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o mensaje de error
      description: Arrastra imágenes o pega el error aquí.
    validations:
      required: false
  - type: dropdown
    id: urgencia
    attributes:
      label: ¿Bloquea la entrega?
      options:
        - "Sí, main está roto"
        - "Molesta, pero se puede seguir"
        - "Detalle menor"
    validations:
      required: true

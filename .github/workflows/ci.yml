name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node, si hay package.json
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas con npm
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test

      - name: Python, si hay pyproject.toml o requirements.txt
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas con pytest
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest -q

      - name: Sin pruebas todavía
        if: hashFiles('package.json', 'pyproject.toml', 'requirements.txt') == ''
        run: echo "Aún no hay proyecto que probar. Cuando elijan su stack, esta CI correrá sus pruebas."
